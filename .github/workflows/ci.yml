name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-frontend:
    name: Frontend lint + typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install
      - name: Verify release versions are in sync
        run: bash scripts/check-versions.sh
      - run: npm run lint
      - run: npm run build
      - name: Run frontend and repository tests
        run: npm test

      - name: Upload frontend dist for Rust tests
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  test-backend:
    name: Rust tests (${{ matrix.os }})
    needs: lint-frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    env:
      CARGO_NET_RETRY: "10"
      RUSTUP_MAX_RETRIES: "10"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-v2-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-deps-v2-${{ runner.os }}-

      - uses: actions/setup-node@v6
        if: matrix.os != 'ubuntu-22.04'
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies for native platform tests
        if: matrix.os != 'ubuntu-22.04'
        run: npm install

      - name: Run frontend tests on native platform
        if: matrix.os != 'ubuntu-22.04'
        run: npm exec vitest run

      - name: Test macOS launcher
        if: matrix.os == 'macos-latest'
        run: bash tests/scripts/macos-launcher.test.sh

      - name: Run tests
        working-directory: src-tauri
        run: cargo test
